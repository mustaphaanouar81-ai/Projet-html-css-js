<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Promotion</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
  body{background:#f9f5f0;color:#222}
  header{background:#111;color:#fff;padding:20px 40px;font-size:18px}
  h1{text-align:center;padding:35px 0 10px;font-size:38px}
  p{text-align:center;color:#666;margin-bottom:35px;font-size:17px}
  .grille{max-width:1450px;margin:0 auto;padding:0 25px 60px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
  .carte{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.1)}
  .carte img{width:100%;height:520px;object-fit:cover;display:block}
  .info{padding:18px;text-align:center}
  .info h3{font-size:19px;margin-bottom:10px}
  .prix{font-weight:bold;font-size:21px;color:#b12704;margin-bottom:14px}
  .prix span{color:#999;text-decoration:line-through;font-size:14px;margin-left:6px}
  .btn{width:100%;padding:14px;border:none;background:#111;color:#fff;border-radius:9px;cursor:pointer;font-size:16px}
  .btn:hover{background:#f2b705;color:#111}
  @media(max-width:1100px){.grille{grid-template-columns:repeat(2,1fr)} .carte img{height:480px}}
  @media(max-width:600px){.grille{grid-template-columns:1fr} .carte img{height:460px}}
</style>
</head>
<body>

<header><b>HANSWEAR</b></header>

<h1>Collection Promotion</h1>
<p>Nouvelle collection 2026</p>

<div class="grille">

  <div class="carte">
    <img src="PULL (6).webp" alt="Robe wax">
    <div class="info">
      <h3>CHEMISE PULL</h3>
      <div class="prix">24,99 € <span>34,99 €</span></div>
      <button class="btn" onclick="payer('CHEMISE PULL - 24,99 €')">Payer</button>
    </div>
  </div>

  <div class="carte">
    <img src="PULLw_1__8_11zon_9d147529-8d5b-4a5b-832a-d26b475450d6.webp" alt="Robe soirée">
    <div class="info">
      <h3>CHEMISE VELOUX</h3>
      <div class="prix">29,99 € <span>39,99 €</span></div>
      <button class="btn" onclick="payer('CHEMISE VELOUX - 29,99 €')">Payer</button>
    </div>
  </div>

  <div class="carte">
    <img src="OIP (3).webp" alt="Ensemble">
    <div class="info">
      <h3>PULL NOIRE</h3>
      <div class="prix">19,99 €</div>
      <button class="btn" onclick="payer('Ensemble 2 Pièces - 19,99 €')">Payer</button>
    </div>
  </div>

  <div class="carte">
    <img src="pull-balenciaga-laine-noir-logo-jaune-homme-col-roule.webp" alt="Abaya">
    <div class="info">
      <h3>PULL BALENCIAGA</h3>
      <div class="prix">32,50 € <span>45,00 €</span></div>
      <button class="btn" onclick="payer('PULL BALENCIAGA - 32,50 €')">Payer</button>
    </div>
  </div>

</div>

<script>
function payer(article){
  alert("Tu as choisi : " + article + "\n\nRedirection vers le paiement...");
}
</script>

</body>
</html>
