<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Femme</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
  body{background:#f9f5f0;color:#222}
  header{background:#111;color:#fff;padding:20px 40px;font-size:18px}
  h1{text-align:center;padding:35px 0 10px;font-size:38px}
  p{text-align:center;color:#666;margin-bottom:35px;font-size:17px}
  .grille{max-width:1450px;margin:0 auto;padding:0 25px 60px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
  .carte{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.1)}
  .carte img{width:100%;height:520px;object-fit:cover;display:block}
  .info{padding:18px;text-align:center}
  .info h3{font-size:19px;margin-bottom:10px}
  .prix{font-weight:bold;font-size:21px;color:#b12704;margin-bottom:14px}
  .prix span{color:#999;text-decoration:line-through;font-size:14px;margin-left:6px}
  .btn{width:100%;padding:14px;border:none;background:#111;color:#fff;border-radius:9px;cursor:pointer;font-size:16px}
  .btn:hover{background:#f2b705;color:#111}
  @media(max-width:1100px){.grille{grid-template-columns:repeat(2,1fr)} .carte img{height:480px}}
  @media(max-width:600px){.grille{grid-template-columns:1fr} .carte img{height:460px}}
</style>
<link rel="stylesheet" href="ui.css">
<script src="script.js" defer></script>
</head>
<body>

<header class="entete-boutique">
  <a href="index.html"><b>HANSWEAR</b></a>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="femme.html">Femme</a>
    <a href="homme.html">Homme</a>
    <a href="accessoires.html">Accessoires</a>
    <a href="promotion.html">Promotions</a>
  </nav>
  <a href="#" class="panier">Panier (0)</a>
</header>

<h1>Collection Femme</h1>
<p>Nouvelle collection 2026</p>

<div class="recherche">
  <input type="search" id="recherche" aria-label="Rechercher un article" placeholder="Rechercher un article...">
</div>
<p id="aucun-resultat" hidden>Aucun article trouvé.</p>

<div class="grille">

  <div class="carte">
    <img src="GHANA.webp" alt="Robe wax">
    <div class="info">
      <h3>Robe Longue Wax Africaine GHANA </h3>
      <div class="prix">224,99 € </div>
      <button class="btn">Ajouter au panier</button>
    </div>
  </div>

  <div class="carte">
    <img src="CAMEROUN.avif" alt="Robe soirée">
    <div class="info">
      <h3>Robe Soirée Élégante AFRICA</h3>
      <div class="prix">279,99 € </div>
      <button class="btn">Ajouter au panier</button>
    </div>
  </div>

  <div class="carte">
    <img src="GG.jpg" alt="Ensemble">
    <div class="info">
      <h3>Robe Soirée Élégante MODE </h3>
      <div class="prix">219,99 €</div>
      <button class="btn">Ajouter au panier</button>
    </div>
  </div>

  <div class="carte">
    <img src="AFRICAN COLLECTION.jpg" alt="Abaya">
    <div class="info">
      <h3>ROBE STYLE MANNEQUIN</h3>
      <div class="prix">192,50 € </div>
      <button class="btn">Ajouter au panier</button>
    </div>
  </div>

</div>


</body>
</html>
